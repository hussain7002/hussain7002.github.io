  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function draw(){
  const th = themeNow(), f = F[th];
  document.documentElement.style.colorScheme = th;
  document.body.style.background = f.layout.paper_bgcolor;
  document.documentElement.style.background = f.layout.paper_bgcolor;
  Plotly.react(el, f.data, f.layout, {displayModeBar:false, responsive:true, scrollZoom:false});
}
draw();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
try { new MutationObserver(draw).observe(parent.document.documentElement, {attributes:true, attributeFilter:['data-theme']}); } catch(e) {}
</script></body></html>
